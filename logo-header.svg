<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 75" width="100%" height="75">
  <defs>
    <linearGradient id="bugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- ================= ISOTIPO: INSECTO / CRISÁLIDA ================= -->
    <g transform="translate(6, 2)">
      <!-- Antenas del insecto -->
      <path d="M 23 15 Q 16 6 12 8" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="11" cy="8" r="2.5" fill="#0284c7" />

      <path d="M 33 15 Q 40 6 44 8" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="45" cy="8" r="2.5" fill="#6366f1" />

      <!-- Cabeza -->
      <circle cx="28" cy="18" r="7" fill="#0f172a" />
      <circle cx="26" cy="17" r="1.5" fill="#ffffff" />
      <circle cx="30" cy="17" r="1.5" fill="#ffffff" />

      <!-- Segmentos del cuerpo / Anillos de la oruga -->
      <!-- Segmento 1 (Tórax) -->
      <rect x="17" y="27" width="22" height="7" rx="3.5" fill="url(#bugGrad)" />
      <!-- Patas pequeñas superiores -->
      <path d="M 17 30 L 11 32" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      <path d="M 39 30 L 45 32" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

      <!-- Segmento 2 -->
      <rect x="15" y="36" width="26" height="7" rx="3.5" fill="url(#bugGrad)" />
      <!-- Patas intermedias -->
      <path d="M 15 39 L 9 42" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      <path d="M 41 39 L 47 42" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

      <!-- Segmento 3 -->
      <rect x="18" y="45" width="20" height="7" rx="3.5" fill="url(#bugGrad)" />

      <!-- Cola / Cola de capullo en punta (Pin de mapa) -->
      <path d="M 23 54 L 28 64 L 33 54 Z" fill="#ec4899" />
      <circle cx="28" cy="64" r="2" fill="#ec4899" />
    </g>

    <!-- ================= WORDMARK ================= -->
    <g transform="translate(74, 42)">
      <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.8">Ches</text>
      <text x="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="800" fill="url(#bugGrad)" letter-spacing="-0.8">Trips</text>
      <text x="2" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94a3b8" letter-spacing="2">TRAVEL METAMORPHOSIS ENGINE</text>
    </g>
  </g>
</svg>
